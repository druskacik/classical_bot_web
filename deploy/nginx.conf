## Assign each selected AI crawler its own shared rate-limit bucket.
## An empty key means ordinary traffic is not rate-limited.
<%
const aiRateLimitId = Array.from(s.publicDomain).reduce(
    (hash, character) => Math.imul(hash ^ character.charCodeAt(0), 16777619) >>> 0,
    2166136261,
).toString(36);
%>
map $http_user_agent $ai_<%-aiRateLimitId%> {
    default     "";
    ~*ClaudeBot "claudebot";
    ~*GPTBot    "gptbot";
    ~*Amazonbot "amazonbot";
}

## Average of one request every five seconds, independently per crawler.
limit_req_zone $ai_<%-aiRateLimitId%> zone=ai_<%-aiRateLimitId%>:10m rate=12r/m;

<%
if (s.forceSsl) {
%>
    server {

        listen       80;

        server_name  <%-s.publicDomain%>;

        # Used by Lets Encrypt
        location /.well-known/acme-challenge/ {
            root <%-s.staticWebRoot%>;
        }

        # Used by CapRover for health check
        location /.well-known/captain-identifier {
            root <%-s.staticWebRoot%>;
        }

        location / {
            return 302 https://$http_host$request_uri;
        }
    }
<%
}
%>


server {

    <%
    if (!s.forceSsl) {
    %>
        listen       80;
    <%
    }
    if (s.hasSsl) {
    %>
        listen              443 ssl http2;
        ssl_certificate     <%-s.crtPath%>;
        ssl_certificate_key <%-s.keyPath%>;
    <%
    }
    %>

        client_max_body_size 500m;

        # Return a meaningful status instead of nginx's default 503 when an AI
        # crawler exceeds its allowance.
        limit_req_status 429;
        limit_req_log_level warn;

        server_name  <%-s.publicDomain%>;

        # Compress dynamic text responses from the Nuxt server. Nitro already
        # serves precompressed public assets and nginx will not recompress a
        # response that already has a Content-Encoding header.
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types
            application/atom+xml
            application/geo+json
            application/javascript
            application/json
            application/ld+json
            application/manifest+json
            application/rss+xml
            application/xml
            image/svg+xml
            text/css
            text/javascript
            text/plain
            text/xml;

        # 127.0.0.11 is DNS set up by Docker, see:
        # https://docs.docker.com/engine/userguide/networking/configure-dns/
        # https://github.com/moby/moby/issues/20026
        resolver 127.0.0.11 valid=10s;
        # IMPORTANT!! If you are here from an old thread to set a custom port, you do not need to modify this port manually here!!
        # Simply change the Container HTTP Port from the dashboard HTTP panel
        set $upstream http://<%-s.localDomain%>:<%-s.containerHttpPort%>;

        location / {

            # Permit short bursts, but cap each selected crawler's sustained
            # request rate. Requests from all other clients have an empty key
            # and are not tracked by this zone.
            limit_req zone=ai_<%-aiRateLimitId%> burst=3 nodelay;


	<%
	if (s.redirectToPath) {
	%>
	    return 302 <%-s.redirectToPath%>$request_uri;
	<%
	} else {
	%>

		    <%
		    if (s.httpBasicAuthPath) {
		    %>
			    auth_basic           "Restricted Access";
			    auth_basic_user_file <%-s.httpBasicAuthPath%>; 
		    <%
		    }
		    %>

			    proxy_pass $upstream;
			    proxy_set_header Host $host;
			    proxy_set_header X-Real-IP $remote_addr;
			    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			    proxy_set_header X-Forwarded-Proto $scheme;

		    <%
		    if (s.websocketSupport) {
		    %>
			    proxy_set_header Upgrade $http_upgrade;
			    proxy_set_header Connection "upgrade";
			    proxy_http_version 1.1;
		    <%
		    }
		    %>
    
    
	<%
	}
	%>
	
        }

        # Used by Lets Encrypt
        location /.well-known/acme-challenge/ {
            root <%-s.staticWebRoot%>;
        }
        
        # Used by CapRover for health check
        location /.well-known/captain-identifier {
            root <%-s.staticWebRoot%>;
        }

        error_page 502 /captain_502_custom_error_page.html;
        location = /captain_502_custom_error_page.html {
                root <%-s.customErrorPagesDirectory%>;
                internal;
        }
}
