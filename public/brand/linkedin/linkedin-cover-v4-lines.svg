<svg
  width="4200"
  height="700"
  viewBox="0 0 4200 700"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>ClassicalBot LinkedIn cover, highlighted lines</title>
  <defs>
    <linearGradient id="night" x1="0" y1="350" x2="4200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="4200" height="700" fill="url(#night)"/>

  <!-- The three staff/list rules from the brand mark. -->
  <path
    d="M0 255.5H4200M0 350H4200M0 444.5H4200"
    stroke="#334155"
    stroke-width="9"
  />

  <!-- Only the mark's inner strokes are highlighted; the enclosing C is omitted. -->
  <path
    d="M2450 255.5H2810M2395 350H2865M2450 444.5H2810"
    stroke="#FAFAF9"
    stroke-width="27"
    stroke-linecap="round"
  />
</svg>
